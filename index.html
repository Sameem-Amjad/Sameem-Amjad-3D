<!DOCTYPE html>
<html lang="en" class="pre-hydrate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="4II4UEErd2UTCqjkBl2HKXwF3M7FOn-ihPDRuIl3yDA" />
    <meta name="theme-color" content="#05060f" />
    <meta name="author" content="Sameem Amjad" />
    <!-- Everything between these markers is route-specific and is replaced
         per page by scripts/prerender.mjs at build time; <Seo> keeps it in
         step afterwards on client-side navigation. What is here is the
         homepage default, which is also what `vite dev` serves. -->
    <!--seo:start-->
    <title>Sameem Amjad — Founder &amp; Lead Engineer · DevoraX</title>
    <meta name="description" content="Sameem Amjad — Founder &amp; Lead Engineer at DevoraX. I lead teams that ship production-grade web, mobile and AI products that scale to millions of users." data-seo="name:description" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" data-seo="name:robots" />
    <link rel="canonical" href="https://sameem-the-dev.vercel.app/" data-seo="rel:canonical" />
    <meta property="og:type" content="profile" data-seo="prop:og:type" />
    <meta property="og:site_name" content="Sameem Amjad" data-seo="prop:og:site_name" />
    <meta property="og:title" content="Sameem Amjad — Founder &amp; Lead Engineer · DevoraX" data-seo="prop:og:title" />
    <meta property="og:description" content="Sameem Amjad — Founder &amp; Lead Engineer at DevoraX. I lead teams that ship production-grade web, mobile and AI products that scale to millions of users." data-seo="prop:og:description" />
    <meta property="og:url" content="https://sameem-the-dev.vercel.app/" data-seo="prop:og:url" />
    <meta property="og:image" content="https://sameem-the-dev.vercel.app/myimage/profile.png" data-seo="prop:og:image" />
    <meta property="og:locale" content="en_US" data-seo="prop:og:locale" />
    <meta name="twitter:card" content="summary_large_image" data-seo="name:twitter:card" />
    <meta name="twitter:image" content="https://sameem-the-dev.vercel.app/myimage/profile.png" data-seo="name:twitter:image" />
    <!--seo:end-->

    <!-- Fonts load here, not via @import in index.css. An @import is only
         discovered after the bundled stylesheet downloads and parses, so the
         font request starts one round trip late and blocks first paint for
         that whole window — preconnect cannot fix that, because it warms the
         connection but never tells the browser what to fetch. As a <link> in
         the document the request goes out with the initial HTML parse, in
         parallel with the CSS. `display=swap` keeps text visible meanwhile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" makes the browser fetch this without blocking the first
         paint, and onload flips it to "all" so it applies the moment it lands.
         As a plain stylesheet it cost ~1s of render-blocking time on mobile;
         `display=swap` already means text is readable in a fallback face
         meanwhile, so blocking bought nothing. <noscript> keeps it working
         with JS disabled. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Project imagery is served from Supabase Storage. -->
    <link rel="preconnect" href="https://arqdtyoiwvhpxkuyettb.supabase.co" />

    <!-- Framer Motion serialises its `initial` state into the prerendered
         HTML, so ~125 elements ship as opacity:0 and only become visible once
         React has hydrated and the animations run. The content was in the
         HTML the whole time, but on mobile that put LCP at 8.6s, 92% of it
         render delay rather than network.

         Until hydration, show the above-the-fold block. Scoped to #hero on
         purpose: everything below it animates on scroll, and forcing those
         visible would make them flash in and back out when framer-motion
         takes over. main.jsx drops .pre-hydrate on mount, after which
         framer-motion owns these styles again.

         There was a boot splash here — a fixed, full-viewport overlay shown
         until React mounted. It made sense when the page really was an empty
         <div id="root">; once prerendering landed it covered content that had
         already arrived, so it is gone. -->
    <style>
      .pre-hydrate #hero [style*="opacity:0"] {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>

    <!-- Prerendered markup is present in the HTML but invisible without JS:
         #boot is an opaque fixed overlay that only main.jsx removes, and every
         framer-motion element ships its `initial` state as inline opacity:0.
         A crawler that doesn't execute scripts would see a blank near-black
         page — exactly what prerendering exists to prevent. Scoped to
         <noscript>, so the animated first paint is untouched when JS runs. -->
    <noscript>
      <style>
        #boot {
          display: none !important;
        }
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
      <div class="boot-bar"></div>
      <div class="boot-tag">Loading portfolio</div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
